name: Pull request

# Checks for pull requests, including those from forks. Untrusted code: this
# runs on GitHub-hosted runners only, with a read-only token and no secrets,
# and uses `pull_request`, never `pull_request_target`. The full suite
# (household.yml) runs on the household's own runner for pushes by its
# maintainers only; do not move it here.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  APP_FEATURES: about,autosize,multi-window,tokio,winit,surface-message,wayland,wgpu,dbus-config

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libglvnd-dev libinput-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: libcosmic with the apps' features
        run: cargo check --locked --lib --no-default-features --features "$APP_FEATURES"

      - name: libcosmic
        run: cargo test --locked --lib

      - name: cosmic-theme
        run: cargo test --locked -p cosmic-theme

      - name: iced widgets
        working-directory: iced
        run: cargo test --locked -p iced_widget --lib
